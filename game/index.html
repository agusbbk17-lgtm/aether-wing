<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether Wing — Island Air Racing</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a1018'/%3E%3Cpath d='M16 4 L19 14 L28 16 L19 18 L16 28 L13 18 L4 16 L13 14 Z' fill='%23ffc857'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1018; }
  body { font-family: "DejaVu Sans Mono", "Courier New", ui-monospace, monospace; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #touch { position: fixed; inset: 0; display: none; }
  body.touch #touch { display: block; }
  .pad {
    position: absolute; bottom: 6vh; width: 22vh; height: 22vh; border-radius: 50%;
    border: 2px solid rgba(143,233,255,0.45); background: rgba(9,16,22,0.35);
    pointer-events: auto; touch-action: none;
  }
  #stick { left: 4vw; }
  #throttle { right: 4vw; bottom: 26vh; height: 16vh; width: 10vh; border-radius: 8vh; }
  .touch-btn {
    position: absolute; right: 4vw; bottom: 6vh; width: 16vh; height: 8vh; border-radius: 2vh;
    border: 2px solid rgba(255,200,87,0.5); background: rgba(9,16,22,0.4);
    pointer-events: auto; touch-action: none; color: #ffc857; text-align: center;
    line-height: 8vh; font-size: 2.4vh;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="scene" aria-label="Aether Wing: a flight game over the island of Sable Reach"></canvas>
<canvas id="hud"></canvas>
<div id="touch">
  <div class="pad" id="stick"></div>
  <div class="pad" id="throttle"></div>
  <div class="touch-btn" id="viewBtn">VIEW</div>
  <div class="touch-btn" id="brakeBtn" style="right:22vw">BRAKE</div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
